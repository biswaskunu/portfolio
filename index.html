    <script>
      (function () {
        // Marks the document as JS-capable BEFORE first paint so CSS can
        // gate JS-only UI (collapsed project panels, entrance animations).
        // Crawlers that don't run scripts never get this class, so the
        // prerendered HTML renders fully expanded and readable.
        document.documentElement.classList.add("js");
        try {
          var saved = localStorage.getItem("theme");
          var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
